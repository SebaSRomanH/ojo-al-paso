<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120826">
<meta name="description" content="Corre, salta las cacas y supera tu récord.">
<title>¡Ojo al paso!</title>
<style>
  :root {
    --bg: #120826;
    --panel: rgba(18, 8, 38, 0.88);
    --ink: #fff6e0;
    --accent: #ffd23f;
    --btn: #ff6f61;
    --btn-ink: #1b0b3a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #game {
    position: relative;
    container-type: size;
    aspect-ratio: 8 / 3;
    width: min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
               (100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 8 / 3);
    width: min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),
               (100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 8 / 3);
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none;
  }
  button {
    font: inherit; font-weight: bold; letter-spacing: 0.06em;
    color: var(--btn-ink); background: var(--btn);
    border: 3px solid var(--ink); border-radius: 0;
    box-shadow: 4px 4px 0 #000;
    min-height: 44px; padding: 0.4em 1.1em;
    font-size: clamp(14px, 6cqh, 24px);
    cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button.secondary { background: var(--accent); }
  [hidden] { display: none !important; }

  #jump {
    position: absolute; right: 2.5%; bottom: 1.5%;
    min-width: 22%; height: max(44px, 14%); padding: 0 1em;
    opacity: 0.92;
  }
  #topbar {
    position: absolute; right: 2%; top: 3%; z-index: 3;
    display: flex; gap: 2cqw;
  }
  .icon {
    width: max(52px, 17cqh); height: max(52px, 17cqh); padding: 0;
    display: grid; place-items: center;
    background: var(--accent);
  }
  .icon svg { width: 68%; height: 68%; }
  #sound .off { display: none; }
  #sound[aria-pressed="false"] { background: #8a7fa8; }
  #sound[aria-pressed="false"] .on { display: none; }
  #sound[aria-pressed="false"] .off { display: inline; }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3cqh; padding: 3%;
    background: var(--panel); text-align: center;
  }
  .overlay h1, .overlay h2 {
    margin: 0; color: var(--accent);
    font-size: clamp(22px, 13cqh, 60px);
    text-shadow: 3px 3px 0 #ff4fd8;
  }
  .overlay p { margin: 0; font-size: clamp(12px, 5.2cqh, 22px); line-height: 1.35; }
  .overlay .small { opacity: 0.8; font-size: clamp(11px, 4.4cqh, 18px); }
  .row { display: flex; gap: 4cqw; flex-wrap: wrap; justify-content: center; }

  #over { padding-top: calc(max(52px, 17cqh) + 3cqh); }
  .over-grid {
    display: grid; grid-template-columns: 1.3fr 1fr; gap: 4cqw;
    align-items: center; width: 100%;
  }
  .over-main { display: flex; flex-direction: column; align-items: center; gap: 2.5cqh; }
  #over h2 { font-size: clamp(20px, 10cqh, 48px); }
  #save-form { display: flex; flex-direction: column; align-items: center; gap: 1.5cqh; }
  #name {
    font: inherit; font-weight: bold; font-size: clamp(14px, 6cqh, 24px);
    width: 5ch; min-height: 44px; padding: 0.2em;
    text-align: center; text-transform: uppercase;
    color: var(--ink); background: #000; border: 3px solid var(--ink); border-radius: 0;
    -webkit-user-select: text; user-select: text;
  }
  #name:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ranking h3 {
    margin: 0 0 1.5cqh; color: var(--accent);
    font-size: clamp(12px, 5.5cqh, 22px); letter-spacing: 0.1em;
  }
  .ranking ol {
    margin: 0; padding: 0; list-style: none;
    font-size: clamp(10px, 4.4cqh, 17px); line-height: 1.3; text-align: left;
  }
  .ranking li { white-space: pre; }
  .ranking li.me { color: var(--accent); font-weight: bold; }

  #rotate {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
    background: var(--bg);
  }
  #rotate .phone {
    width: 48px; height: 80px; border: 4px solid var(--accent);
    animation: spin 2s steps(4) infinite;
  }
  @keyframes spin { 50% { transform: rotate(90deg); } }
  #rotate p { margin: 0; font-size: 20px; }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotate { display: flex; }
  }

  #toast {
    position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
    max-width: 90%; padding: 0.5em 1em;
    background: #000; color: var(--ink); border: 2px solid var(--accent);
    font-size: clamp(12px, 4.6cqh, 18px); text-align: center;
    z-index: 5;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="screen" width="800" height="300" aria-label="Zona de juego" role="img"></canvas>

  <div id="topbar">
    <button id="sound" class="icon" type="button" aria-label="Sonido" aria-pressed="true">
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <path d="M2 6h4l5-4v14l-5-4H2z" fill="currentColor"/>
        <g class="on" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 6.5c1 1.5 1 3.5 0 5"/><path d="M15 4c2 3 2 7 0 10"/></g>
        <g class="off" stroke="currentColor" stroke-width="2"><path d="M13 6l4 6M17 6l-4 6"/></g>
      </svg>
    </button>
    <button id="pause" class="icon" type="button" aria-label="Pausar" hidden>
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 3h3v12H4zM11 3h3v12h-3z" fill="currentColor"/></svg>
    </button>
  </div>
  <button id="jump" type="button" hidden>SALTAR</button>

  <section id="start" class="overlay" aria-labelledby="start-title">
    <h1 id="start-title">¡Ojo al paso!</h1>
    <p>Corre, salta las cacas y supera tu récord.</p>
    <p class="small">Toca SALTAR o la pantalla · Computador: Espacio o ↑ · Esc pausa · M sonido</p>
    <p class="small">Récord: <span id="start-best">0</span></p>
    <div class="row">
      <button id="play" type="button">JUGAR</button>
      <button class="secondary share" type="button">COMPARTIR</button>
    </div>
  </section>

  <section id="paused" class="overlay" aria-labelledby="paused-title" hidden>
    <h2 id="paused-title">Pausa</h2>
    <p class="small">Toca SEGUIR o presiona Espacio</p>
    <button id="resume" type="button">SEGUIR</button>
  </section>

  <section id="over" class="overlay" aria-labelledby="over-title" hidden>
    <div class="over-grid">
      <div class="over-main">
        <h2 id="over-title">¡Plop! La pisaste</h2>
        <p>Puntos: <span id="over-score">0</span> · Duraste <span id="over-time">0</span> s</p>
        <p class="small" id="over-new" hidden>¡Nuevo récord!</p>
        <form id="save-form" hidden>
          <label class="small" for="name">¡Entraste al ranking! Tus iniciales:</label>
          <div class="row">
            <input id="name" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done">
            <button type="submit">GUARDAR</button>
          </div>
        </form>
        <div class="row">
          <button id="again" type="button">OTRA VEZ</button>
          <button class="secondary share" type="button">COMPARTIR</button>
        </div>
      </div>
      <div class="ranking">
        <h3 id="ranking-title">RANKING</h3>
        <ol id="ranking-list" aria-labelledby="ranking-title"></ol>
      </div>
    </div>
  </section>

  <div id="toast" role="status" hidden></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</div>

<div id="rotate" role="alert">
  <div class="phone" aria-hidden="true"></div>
  <p>Gira tu teléfono para jugar</p>
</div>

<script>
(() => {
  'use strict';

  // ---- Reglas (v0.2) ----
  const W = 800, H = 300, GROUND = 250;
  // Velocidad exponencial: x6 a los 20 s (casi imposible). Tope para que el
  // paso de simulación no atraviese cacas.
  const SPEED_START = 300, SPEED_GROWTH = Math.log(6) / 20, SPEED_MAX = 3000;
  const LEVEL_EVERY = 5;                 // aviso de "más rápido" cada 5 s
  const PAIR_CHANCE = 0.18;              // cacas dobles: se saltan juntas
  const GRAVITY = 3000, JUMP_VELOCITY = 950;
  const MAX_DT = 0.1, STEP = 1 / 120;
  const REACT_TIME = 1.4;                // segundos de "¡puaj!" antes del fin de partida
  const SCORE_DIVISOR = 12;
  const BEST_KEY = 'ojo-al-paso:record';
  const RANK_KEY = 'ojo-al-paso:ranking', NAME_KEY = 'ojo-al-paso:nombre', RANK_SIZE = 10;

  const canvas = document.getElementById('screen');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const $ = (id) => document.getElementById(id);
  const ui = {
    start: $('start'), paused: $('paused'), over: $('over'),
    jump: $('jump'), pause: $('pause'),
    startBest: $('start-best'), overScore: $('over-score'), overTime: $('over-time'), overNew: $('over-new'),
    saveForm: $('save-form'), name: $('name'), rankList: $('ranking-list'),
    toast: $('toast'), live: $('live'), again: $('again'),
  };
  const portrait = matchMedia('(orientation: portrait) and (max-width: 900px)');
  const touch = matchMedia('(pointer: coarse)');

  // ---- Sprites pixel art originales ----
  function makeSprite(rows, palette, cellW, cellH) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(rows[0].length * cellW);
    c.height = Math.ceil(rows.length * cellH);
    const g = c.getContext('2d');
    rows.forEach((row, y) => {
      [...row].forEach((ch, x) => {
        if (ch === '.') return;
        g.fillStyle = palette[ch];
        g.fillRect(Math.floor(x * cellW), Math.floor(y * cellH), Math.ceil(cellW), Math.ceil(cellH));
      });
    });
    return c;
  }

  const KID_PAL = { k: '#2d6cdf', h: '#4a2a12', s: '#f2b38a', e: '#111111', r: '#e83f3f', b: '#2b3a8f', w: '#f5f5f5' };
  const KID_TOP = [
    '....kkkkk...',
    '...kkkkkkkk.',
    '...hhsssss..',
    '...hsssess..',
    '...hssssss..',
    '....ssss....',
    '...rrrrrr...',
    '..rrrrrrrs..',
    '..srrrrrr...',
    '....rrrr....',
  ];
  const KID_RUN_A = ['....bbbb....', '...bb..bb...', '..bb....bb..', '..b......b..', '.ww......ww.', '............'];
  const KID_RUN_B = ['....bbbb....', '....bbbb....', '....b.bb....', '....b.b.....', '...ww.ww....', '............'];
  const KID_AIR   = ['....bbbb....', '...bbbbbb...', '..bb...bbww.', '..ww........', '............', '............'];
  const PX = 3;
  const kidFrames = {
    runA: makeSprite([...KID_TOP, ...KID_RUN_A], KID_PAL, PX, PX),
    runB: makeSprite([...KID_TOP, ...KID_RUN_B], KID_PAL, PX, PX),
    air:  makeSprite([...KID_TOP, ...KID_AIR],  KID_PAL, PX, PX),
  };
  const KID_X = 90, KID_FEET = 15 * PX, KID_GROUND_Y = GROUND - KID_FEET;

  // Reacción al pisar: el niño se pone verde y aparece una viñeta con cara de asco
  // estilo manhwa (ojos > <, rayas azules en la frente, lengua afuera).
  const SICK_PAL = { ...KID_PAL, s: '#b9d99a' };
  kidFrames.sick = makeSprite([...KID_TOP, ...KID_RUN_A], SICK_PAL, PX, PX);
  kidFrames.sickAir = makeSprite([...KID_TOP, ...KID_AIR], SICK_PAL, PX, PX);
  const FACE_PAL = { k: '#2d6cdf', h: '#4a2a12', s: '#f2b38a', b: '#5a7bd8', e: '#111111', g: '#8fd16a', m: '#3b200b', t: '#ff6f8a' };
  const FACE = [
    '....kkkkkkkk....',
    '..kkkkkkkkkkkk..',
    '.kkkkkkkkkkkkkkk',
    '.hsbsbsbsbsbsbh.',
    '.hsbsbsbsbsbsbh.',
    '.hssssssssssssh.',
    '.hsessssssssesh.',
    '.hssessssssessh.',
    '.hsessssssssesh.',
    '.hggssssssssggh.',
    '.hsssmmmmmmsssh.',
    '.hssmsmsmmsmssh.',
    '..sssmttmsssss..',
    '..ssssttssssss..',
    '...ssssssssss...',
    '....ssssssss....',
  ];
  const bubble = (() => {
    const c = document.createElement('canvas');
    c.width = 100; c.height = 112;
    const g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, 100, 100);
    g.fillStyle = '#fff6e0'; g.fillRect(4, 4, 92, 92);
    g.fillStyle = '#000';
    g.fillRect(8, 96, 16, 4); g.fillRect(8, 100, 12, 4); g.fillRect(8, 104, 8, 4); g.fillRect(8, 108, 4, 4);
    g.fillStyle = '#fff6e0';
    g.fillRect(12, 96, 8, 4); g.fillRect(12, 100, 4, 4);
    g.drawImage(makeSprite(FACE, FACE_PAL, 5, 5), 10, 10);
    return c;
  })();

  const POOP_PAL = { d: '#7a4a1e', h: '#b0743a', w: '#ffffff', k: '#111111', m: '#3b200b' };
  const POOP = [
    '....d.....',
    '....dd....',
    '...dddd...',
    '..ddhddd..',
    '..dddddd..',
    '.dwkddwkd.',
    '.dddddddd.',
    'dhddmmdddd',
    'dddddddddd',
  ];

  // ---- Fondo estilo años 80 (estático, se dibuja una vez) ----
  const sky = document.createElement('canvas');
  sky.width = W; sky.height = GROUND;
  (() => {
    const g = sky.getContext('2d');
    const bands = ['#1b0b3a', '#2a0f4f', '#3d1263', '#5a1a74', '#7d2480', '#a53584', '#d04f80', '#f2777a'];
    const bh = GROUND / bands.length;
    bands.forEach((col, i) => { g.fillStyle = col; g.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh)); });
    g.fillStyle = '#fff6e0';
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 40; i++) g.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * 110), 2, 2);
    const cx = 600, cy = 170, r = 64;
    for (let y = -r; y < r; y += 4) {
      const t = (y + r) / (2 * r);
      if (y > 0 && Math.floor(y / 4) % 3 === 0) continue;
      const half = Math.floor(Math.sqrt(r * r - y * y));
      g.fillStyle = t < 0.5 ? '#ffd23f' : '#ff8f4f';
      g.fillRect(cx - half, cy + y, half * 2, 4);
    }
  })();
  const HILL_STEP = 8, HILL_COUNT = W / HILL_STEP;
  const hills = Array.from({ length: HILL_COUNT }, (_, i) => {
    const a = (i / HILL_COUNT) * Math.PI * 2;
    return Math.round((34 + 22 * Math.sin(a * 3) + 12 * Math.sin(a * 7 + 1)) / 4) * 4;
  });
  const pebbles = Array.from({ length: 18 }, (_, i) => ({ x: (i * 97) % W, y: GROUND + 10 + ((i * 37) % 34) }));

  // ---- Música original chiptune: metal 80s con bajo galopante (Web Audio, sin archivos) ----
  const Music = (() => {
    const BPM = 160, SIXTEENTH = 60 / BPM / 4, VOLUME = 0.18;
    const MUTE_KEY = 'ojo-al-paso:silencio';
    const SEMI = { C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 };
    const freq = (n) => {
      const m = /^([A-G])(#?)(\d)$/.exec(n);
      return 440 * 2 ** ((SEMI[m[1]] + (m[2] ? 1 : 0) + (Number(m[3]) - 4) * 12) / 12);
    };
    // Mi menor; armonía una tercera diatónica abajo (dos guitarras).
    const SCALE = ['E', 'F#', 'G', 'A', 'B', 'C', 'D'];
    const third = (n) => {
      const m = /^([A-G]#?)(\d)$/.exec(n);
      const i = SCALE.indexOf(m[1]);
      if (i < 0) return freq(n) / 2 ** (4 / 12);
      const j = i - 2, oct = Number(m[2]) - (j < 0 ? 1 : 0);
      return freq(SCALE[(j + 7) % 7] + oct);
    };
    // [nota, duración en semicorcheas]; cada compás suma 16.
    // Galope: corchea + dos semicorcheas en cada tiempo.
    const gallop = (a, b, c) => [[a, 2], [b, 1], [c, 1]];
    const RIFF = [  // riff sobre nota pedal, sin armonía
      ...gallop('G4', 'E4', 'E4'), ...gallop('A4', 'E4', 'E4'), ...gallop('B4', 'E4', 'E4'), ...gallop('A4', 'E4', 'E4'),
      ...gallop('C5', 'E4', 'E4'), ...gallop('B4', 'E4', 'E4'), ...gallop('A4', 'E4', 'E4'), ...gallop('G4', 'E4', 'E4'),
      ...gallop('E4', 'C4', 'C4'), ...gallop('G4', 'C4', 'C4'), ...gallop('A4', 'C4', 'C4'), ...gallop('G4', 'C4', 'C4'),
      ...gallop('F#4', 'D4', 'D4'), ...gallop('A4', 'D4', 'D4'), ...gallop('D5', 'C5', 'B4'), ['A4', 4],
    ];
    const LEAD_1 = [  // dos guitarras armonizadas
      ['B4', 2], ['E5', 2], ['G5', 4], ['F#5', 4], ['E5', 4],
      ['D5', 4], ['E5', 2], ['D5', 2], ['B4', 8],
      ['C5', 4], ['A4', 2], ['C5', 2], ['E5', 4], ['D5', 4],
      ['D#5', 4], ['F#5', 4], ['B4', 8],
    ];
    const LEAD_2 = [
      ['G5', 4], ['F#5', 2], ['E5', 2], ['D5', 4], ['B4', 4],
      ['C5', 4], ['E5', 4], ['G5', 4], ['E5', 4],
      ['F#5', 4], ['A5', 2], ['F#5', 2], ['D5', 4], ['F#5', 4],
      ['D#5', 2], ['F#5', 2], ['B5', 4], ['A5', 2], ['F#5', 2], ['D#5', 4],
    ];
    const BRIDGE = [  // puente sobre La menor que sube hacia el solo
      ...gallop('C5', 'A4', 'A4'), ...gallop('B4', 'A4', 'A4'), ...gallop('C5', 'A4', 'A4'), ...gallop('E5', 'A4', 'A4'),
      ...gallop('A4', 'F4', 'F4'), ...gallop('C5', 'F4', 'F4'), ...gallop('A4', 'F4', 'F4'), ...gallop('G4', 'F4', 'F4'),
      ...gallop('E5', 'C5', 'C5'), ...gallop('D5', 'C5', 'C5'), ...gallop('E5', 'C5', 'C5'), ...gallop('G5', 'C5', 'C5'),
      ...gallop('F#5', 'D5', 'D5'), ...gallop('A5', 'D5', 'D5'), ...gallop('F#5', 'D5', 'D5'), ['D5', 4],
    ];
    const LEAD_3 = [
      ['E5', 4], ['G5', 4], ['B5', 4], ['A5', 2], ['G5', 2],
      ['G5', 6], ['E5', 2], ['C5', 4], ['D5', 4],
      ['E5', 4], ['C5', 2], ['E5', 2], ['A5', 4], ['G5', 4],
      ['F#5', 4], ['D#5', 4], ['B4', 4], ['D#5', 4],
    ];
    // [melodía, armonizada, acorde de cada compás]
    const SECTIONS = {
      riff:   [RIFF,   false, ['E2', 'E2', 'C2', 'D2']],
      lead1:  [LEAD_1, true,  ['E2', 'E2', 'A2', 'B1']],
      lead2:  [LEAD_2, true,  ['E2', 'C2', 'D2', 'B1']],
      bridge: [BRIDGE, false, ['A2', 'F2', 'C2', 'D2']],
      lead3:  [LEAD_3, true,  ['E2', 'C2', 'A2', 'B1']],
    };
    // 32 compases (~48 s). Termina en Si, que resuelve en el Mi del inicio:
    // así el loop se escucha continuo, sin un "final" antes de repetir.
    const SONG = ['riff', 'lead1', 'riff', 'lead2', 'bridge', 'lead3', 'riff', 'lead1'].map((k) => SECTIONS[k]);
    const BASS = SONG.flatMap(([, , chords]) => chords).map(freq);
    const LOOP = BASS.length * 16;
    const leadAt = new Map();
    let s = 0;
    for (const [part, harmonized] of SONG) {
      for (const [n, d] of part) {
        leadAt.set(s, { hi: freq(n), lo: harmonized ? third(n) : 0, dur: d * SIXTEENTH });
        s += d;
      }
    }

    let ac = null, master = null, noise = null, timer = 0, step = 0, nextTime = 0, playing = false;
    let leadAmp, harmAmp, rhythmAmp;
    let muted = false;
    try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch { /* sin almacenamiento */ }

    function ensure() {
      if (ac) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      master.connect(ac.destination);
      noise = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      leadAmp = amp(30, 3200, 0.32);
      harmAmp = amp(30, 2800, 0.22);
      rhythmAmp = amp(60, 1800, 0.3);
      return true;
    }

    // "Amplificador" de guitarra: distorsión + filtro para que no chille.
    function amp(drive, cutoff, vol) {
      const shaper = ac.createWaveShaper(), lp = ac.createBiquadFilter(), g = ac.createGain();
      const curve = new Float32Array(1024);
      for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh(drive * (i / 511.5 - 1)) / Math.tanh(drive);
      shaper.curve = curve;
      lp.type = 'lowpass'; lp.frequency.value = cutoff;
      g.gain.value = vol;
      shaper.connect(lp).connect(g).connect(master);
      return shaper;
    }

    function tone(f, t, dur, type, vol, f2, dest = master) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(dest);
      o.start(t); o.stop(t + dur + 0.02);
    }

    function hiss(t, dur, vol, cutoff) {
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise;
      f.type = 'highpass'; f.frequency.value = cutoff;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(f).connect(g).connect(master);
      src.start(t); src.stop(t + dur + 0.02);
    }

    function schedule(i, t) {
      const note = leadAt.get(i);
      if (note) {
        tone(note.hi, t, note.dur * 0.92, 'sawtooth', 0.3, 0, leadAmp);
        if (note.lo) tone(note.lo, t, note.dur * 0.92, 'sawtooth', 0.3, 0, harmAmp);
      }
      // Bajo y guitarra rítmica (quinta) galopando juntos.
      const beatPos = i % 4, root = BASS[Math.floor(i / 16)];
      if (beatPos !== 1) {
        const d = beatPos === 0 ? SIXTEENTH * 1.6 : SIXTEENTH * 0.8;
        tone(root, t, d, 'triangle', 0.5);
        tone(root * 2, t, d, 'sawtooth', 0.25, 0, rhythmAmp);
        tone(root * 3, t, d, 'sawtooth', 0.18, 0, rhythmAmp);
      }
      const barPos = i % 16;
      if ([0, 2, 3, 8, 10, 11].includes(barPos)) tone(150, t, 0.1, 'sine', 0.8, 40);
      if (barPos === 4 || barPos === 12) hiss(t, 0.12, 0.35, 1500);
      if (i % 64 === 0) hiss(t, 0.8, 0.22, 5000);
      else if (i % 2 === 0) hiss(t, 0.03, 0.08, 7000);
    }

    function tick() {
      while (nextTime < ac.currentTime + 0.12) {
        schedule(step, nextTime);
        nextTime += SIXTEENTH;
        step = (step + 1) % LOOP;
      }
    }

    return {
      get muted() { return muted; },
      play(fromStart) {
        if (!ensure()) return;
        if (ac.state === 'suspended') ac.resume();
        if (fromStart) step = 0;
        if (playing) return;
        playing = true;
        nextTime = ac.currentTime + 0.05;
        timer = setInterval(tick, 25);
        tick();
      },
      stop() { playing = false; clearInterval(timer); },
      jump() { if (ensure()) tone(330, ac.currentTime, 0.14, 'square', 0.25, 880); },
      speedUp() {
        if (!ensure()) return;
        const t = ac.currentTime;
        ['E5', 'G5', 'B5', 'E6'].forEach((n, k) => tone(freq(n), t + k * 0.06, 0.08, 'square', 0.18));
      },
      crash() {
        if (!ensure()) return;
        const t = ac.currentTime;
        ['E4', 'C4', 'A3', 'E3'].forEach((n, k) => tone(freq(n), t + k * 0.11, 0.14, 'square', 0.25));
        hiss(t, 0.2, 0.4, 400);
      },
      setMuted(m) {
        muted = m;
        try { localStorage.setItem(MUTE_KEY, m ? '1' : '0'); } catch { /* sin almacenamiento */ }
        if (master) master.gain.setTargetAtTime(m ? 0 : VOLUME, ac.currentTime, 0.02);
      },
    };
  })();

  // ---- Estado ----
  let state = 'start';
  let kid, obstacles, speed, distance, elapsed, level, bannerT, spawnIn, hillOff, groundOff, overAt = 0;
  let lastScore = 0;
  let reactT = 0, overShown = false, hitPoop = null, flies = [];
  let ranking = loadRanking();
  let best = Math.max(loadBest(), ranking[0] ? ranking[0].score : 0);

  function loadBest() {
    try { return Math.max(0, parseInt(localStorage.getItem(BEST_KEY), 10) || 0); } catch { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem(BEST_KEY, String(best)); } catch { /* sin almacenamiento: se sigue jugando */ }
  }
  const score = () => Math.floor(distance / SCORE_DIVISOR);
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---- Ranking local (top 10 en este dispositivo) ----
  function loadRanking() {
    try {
      const list = JSON.parse(localStorage.getItem(RANK_KEY));
      if (!Array.isArray(list)) return [];
      return list
        .filter((r) => r && typeof r.name === 'string' && Number.isFinite(r.score))
        .sort((a, b) => b.score - a.score)
        .slice(0, RANK_SIZE);
    } catch { return []; }
  }
  const qualifies = (s) => s > 0 && (ranking.length < RANK_SIZE || s > ranking[ranking.length - 1].score);
  function addToRanking(name, s) {
    const entry = { name, score: s };
    ranking = [...ranking, entry].sort((a, b) => b.score - a.score).slice(0, RANK_SIZE);
    try { localStorage.setItem(RANK_KEY, JSON.stringify(ranking)); } catch { /* queda solo en esta sesión */ }
    return ranking.indexOf(entry);
  }
  function renderRanking(highlight = -1) {
    ui.rankList.replaceChildren(...Array.from({ length: RANK_SIZE }, (_, i) => {
      const r = ranking[i];
      const li = document.createElement('li');
      li.textContent = `${String(i + 1).padStart(2)}. ${r ? r.name.padEnd(3) : '---'}  ${r ? String(r.score).padStart(5, '0') : '-----'}`;
      if (i === highlight) li.className = 'me';
      return li;
    }));
  }
  const cleanName = (v) => v.toUpperCase().replace(/[^A-Z0-9ÑÁÉÍÓÚÜ]/g, '').slice(0, 3);
  function loadName() { try { return localStorage.getItem(NAME_KEY) || ''; } catch { return ''; } }
  function saveName(n) { try { localStorage.setItem(NAME_KEY, n); } catch { /* sin almacenamiento */ } }

  function reset() {
    kid = { y: KID_GROUND_Y, vy: 0, onGround: true };
    obstacles = [];
    speed = SPEED_START;
    distance = 0;
    elapsed = 0; level = 0; bannerT = 0;
    reactT = 0; overShown = false; hitPoop = null; flies = [];
    spawnIn = 1.0;
    hillOff = 0; groundOff = 0;
  }

  const makePoop = (x, w, h) => ({ x, w, h, sprite: makeSprite(POOP, POOP_PAL, w / 10, h / 9) });

  // Devuelve los segundos hasta la siguiente aparición. Mezcla tramos
  // seguidos, normales y respiros; nunca menos que el tiempo de un salto (0,63 s).
  function spawn() {
    if (Math.random() < PAIR_CHANCE) {
      const w1 = Math.round(rand(38, 44)), w2 = Math.round(rand(38, 44));
      obstacles.push(makePoop(W + 10, w1, Math.round(rand(34, 40))));
      obstacles.push(makePoop(W + 10 + w1 + Math.round(rand(6, 16)), w2, Math.round(rand(34, 40))));
      return rand(1.2, 2.2);
    }
    obstacles.push(makePoop(W + 10, Math.round(rand(38, 58)), Math.round(rand(34, 46))));
    const r = Math.random();
    if (r < 0.3) return rand(0.85, 1.15);
    if (r < 0.85) return rand(1.15, 2.2);
    return rand(2.2, 3.0);
  }

  function hits(o) {
    const kx = KID_X + 9, ky = kid.y + 6, kw = 18, kh = 36;
    const oy = GROUND + 2 - o.h;
    const ox = o.x + o.w * 0.18, oyy = oy + o.h * 0.25, ow = o.w * 0.64, oh = o.h * 0.75;
    return kx < ox + ow && kx + kw > ox && ky < oyy + oh && ky + kh > oyy;
  }

  function update(dt) {
    elapsed += dt;
    speed = Math.min(SPEED_MAX, SPEED_START * Math.exp(SPEED_GROWTH * elapsed));
    const lv = Math.floor(elapsed / LEVEL_EVERY);
    if (lv > level) {
      level = lv;
      bannerT = 1.6;
      Music.speedUp();
      announce(`¡Más rápido! Velocidad por ${(speed / SPEED_START).toFixed(1)}`);
    }
    bannerT = Math.max(0, bannerT - dt);
    const dx = speed * dt;
    distance += dx;
    hillOff = (hillOff + dx * 0.15) % W;
    groundOff = (groundOff + dx) % W;

    if (!kid.onGround) {
      kid.vy += GRAVITY * dt;
      kid.y += kid.vy * dt;
      if (kid.y >= KID_GROUND_Y) { kid.y = KID_GROUND_Y; kid.vy = 0; kid.onGround = true; }
    }

    for (const o of obstacles) o.x -= dx;
    obstacles = obstacles.filter((o) => o.x + o.w > -10);

    spawnIn -= dt;
    if (spawnIn <= 0) spawnIn = spawn();

    const hit = obstacles.find(hits);
    if (hit) gameOver(hit);
  }

  // ---- Dibujo ----
  function render() {
    ctx.drawImage(sky, 0, 0);

    ctx.fillStyle = '#2b0d4a';
    for (let x = 0; x < W + HILL_STEP; x += HILL_STEP) {
      const i = Math.floor((x + hillOff) / HILL_STEP) % HILL_COUNT;
      ctx.fillRect(x - (hillOff % HILL_STEP), GROUND - hills[i], HILL_STEP, hills[i]);
    }

    ctx.fillStyle = '#24124a';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#ff4fd8';
    ctx.fillRect(0, GROUND, W, 3);
    ctx.fillStyle = '#6a3fa0';
    for (const p of pebbles) {
      const x = ((p.x - groundOff) % W + W) % W;
      ctx.fillRect(Math.floor(x), p.y, 6, 3);
    }

    for (const o of obstacles) ctx.drawImage(o.sprite, Math.round(o.x), GROUND + 2 - o.h);

    let frame = kidFrames.runA;
    if (state === 'over') frame = kid.onGround ? kidFrames.sick : kidFrames.sickAir;
    else if (!kid.onGround) frame = kidFrames.air;
    else if (state === 'running') frame = Math.floor(distance / 36) % 2 ? kidFrames.runB : kidFrames.runA;
    ctx.drawImage(frame, KID_X, Math.round(kid.y));
    if (state === 'over') drawReaction();

    if (state !== 'start') {
      const pad = (n) => String(n).padStart(5, '0');
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.textBaseline = 'top';
      const mult = (speed / SPEED_START).toFixed(1);
      const text = `PUNTOS ${pad(score())}   RÉCORD ${pad(Math.max(best, score()))}   VEL x${mult}`;
      ctx.fillStyle = '#000';
      ctx.fillText(text, 18, 16);
      ctx.fillStyle = '#fff6e0';
      ctx.fillText(text, 16, 14);

      // Aviso parpadeante al subir de velocidad.
      if (bannerT > 0 && Math.floor(bannerT * 8) % 2 === 0) {
        ctx.font = 'bold 34px "Courier New", monospace';
        ctx.textAlign = 'center';
        const msg = `¡MÁS RÁPIDO! x${mult}`;
        ctx.fillStyle = '#ff4fd8';
        ctx.fillText(msg, W / 2 + 3, 73);
        ctx.fillStyle = '#ffd23f';
        ctx.fillText(msg, W / 2, 70);
        ctx.textAlign = 'start';
      }
    }
  }

  function drawReaction() {
    const t = reactT;
    // Líneas de olor que suben ondulando desde la caca pisada.
    if (hitPoop) {
      ctx.fillStyle = '#8fd16a';
      for (let k = 0; k < 3; k++) {
        const baseX = hitPoop.x + hitPoop.w * (0.25 + k * 0.25);
        for (let j = 0; j < 6; j++) {
          const rise = (t * 40 + j * 9 + k * 13) % 54;
          const y = GROUND - hitPoop.h - 4 - rise;
          const x = baseX + Math.sin((y + t * 60) / 6) * 3;
          ctx.fillRect(Math.round(x), Math.round(y), 3, 3);
        }
      }
    }
    // Moscas zumbando alrededor del niño.
    for (const f of flies) {
      const a = f.phase + t * f.speed;
      const x = Math.round(KID_X + 18 + Math.cos(a) * f.r + Math.sin(t * 23 + f.phase) * 2);
      const y = Math.round(GROUND - 28 + Math.sin(a * 1.3) * f.r * 0.6);
      ctx.fillStyle = '#111111';
      ctx.fillRect(x, y, 3, 3);
      ctx.fillStyle = Math.floor(t * 30 + f.phase) % 2 ? '#dfe8ff' : '#9fb0d0';
      ctx.fillRect(x - 2, y - 2, 2, 2);
      ctx.fillRect(x + 3, y - 2, 2, 2);
    }
    // Viñeta con la cara de asco: aparece con un "pop" desde la cola.
    const s = Math.min(1, t / 0.15);
    const w = Math.round(bubble.width * s), h = Math.round(bubble.height * s);
    if (w < 4) return;
    const bottom = KID_GROUND_Y - 2, left = KID_X + 22;
    ctx.drawImage(bubble, left, bottom - h, w, h);
    if (s === 1) {
      ctx.font = 'bold 30px "Courier New", monospace';
      const jx = Math.round(Math.sin(t * 40) * 2);
      ctx.fillStyle = '#000';
      ctx.fillText('¡PUAJ!', left + 112 + jx, bottom - 82);
      ctx.fillStyle = '#8fd16a';
      ctx.fillText('¡PUAJ!', left + 110 + jx, bottom - 84);
    }
  }

  // ---- Bucle principal ----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(MAX_DT, (now - last) / 1000);
    last = now;
    if (state === 'running' && dt > 0) {
      const n = Math.ceil(dt / STEP), h = dt / n;
      for (let i = 0; i < n && state === 'running'; i++) update(h);
    } else if (state === 'over') {
      reactT += dt;
      if (!overShown && reactT >= REACT_TIME) showOverScreen();
    }
    render();
    requestAnimationFrame(loop);
  }

  // ---- Transiciones ----
  function show(el, visible) { el.hidden = !visible; }
  function controls(visible) { show(ui.jump, visible); show(ui.pause, visible); }
  function announce(msg) { ui.live.textContent = msg; }

  function start() {
    if (portrait.matches) return;
    reset();
    state = 'running';
    show(ui.start, false); show(ui.over, false); show(ui.paused, false);
    controls(true);
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    Music.play(true);
    announce('¡A correr!');
  }

  function jump() {
    if (state !== 'running' || !kid.onGround) return;
    kid.vy = -JUMP_VELOCITY;
    kid.onGround = false;
    Music.jump();
  }

  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    Music.stop();
    controls(false);
    show(ui.paused, true);
    announce('Juego en pausa');
  }

  function resume() {
    if (state !== 'paused' || portrait.matches) return;
    state = 'running';
    show(ui.paused, false);
    controls(true);
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    last = performance.now();
    Music.play(false);
    announce('Seguimos');
  }

  // Choque: primero la reacción (cara de asco, moscas, olor) y luego la pantalla final.
  function gameOver(poop) {
    state = 'over';
    overShown = false;
    reactT = 0;
    hitPoop = poop;
    flies = Array.from({ length: 4 }, () => ({
      phase: rand(0, Math.PI * 2),
      speed: rand(4, 7) * (Math.random() < 0.5 ? -1 : 1),
      r: rand(16, 34),
    }));
    Music.stop();
    Music.crash();
    controls(false);
    announce('¡Puaj! Pisaste una caca.');
  }

  function showOverScreen() {
    overShown = true;
    overAt = performance.now();
    const s = score();
    lastScore = s;
    const isNew = s > best;
    if (isNew) { best = s; saveBest(); }
    ui.overScore.textContent = s;
    ui.overTime.textContent = elapsed.toFixed(1);
    ui.startBest.textContent = best;
    show(ui.overNew, isNew);
    const canSave = qualifies(s);
    show(ui.saveForm, canSave);
    renderRanking();
    show(ui.over, true);
    if (canSave) {
      ui.name.value = loadName();
      // En teléfono no abrimos el teclado solo: tapa la pantalla.
      if (!touch.matches) ui.name.focus({ preventScroll: true });
    } else {
      ui.again.focus({ preventScroll: true });
    }
    announce(`Fin de la carrera. ${s} puntos.${isNew ? ' ¡Nuevo récord!' : ''}${canSave ? ' Entraste al ranking.' : ''}`);
  }

  function saveScore(e) {
    e.preventDefault();
    if (ui.saveForm.hidden) return;
    const name = cleanName(ui.name.value) || '???';
    saveName(name);
    const pos = addToRanking(name, lastScore);
    show(ui.saveForm, false);
    renderRanking(pos);
    ui.again.focus({ preventScroll: true });
    announce(`Guardado en el puesto ${pos + 1} del ranking.`);
  }

  // ---- Compartir ----
  let toastTimer;
  function toast(msg) {
    ui.toast.textContent = msg;
    show(ui.toast, true);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => show(ui.toast, false), 3500);
  }

  async function share() {
    const host = location.hostname;
    const isPublic = /^https?:$/.test(location.protocol) &&
      !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(host) && !host.endsWith('.localhost');
    if (!isPublic) { toast('Primero hay que publicar el juego en internet para compartirlo.'); return; }
    const url = location.href.split('#')[0];
    const text = state === 'over'
      ? `Hice ${score()} puntos en ¡Ojo al paso! ¿Me ganas?`
      : '¡Salta las cacas y supera mi récord en ¡Ojo al paso!';
    if (navigator.share) {
      try { await navigator.share({ title: '¡Ojo al paso!', text, url }); } catch { /* cancelado */ }
      return;
    }
    try { await navigator.clipboard.writeText(url); toast('Enlace copiado. Pégalo en WhatsApp.'); }
    catch { toast(`Copia este enlace: ${url}`); }
  }

  // ---- Entrada ----
  $('play').addEventListener('click', start);
  ui.again.addEventListener('click', start);
  ui.saveForm.addEventListener('submit', saveScore);
  ui.name.addEventListener('input', () => { ui.name.value = cleanName(ui.name.value); });
  $('resume').addEventListener('click', resume);
  ui.pause.addEventListener('click', pause);
  document.querySelectorAll('.share').forEach((b) => b.addEventListener('click', share));

  const soundBtn = $('sound');
  function syncSound() { soundBtn.setAttribute('aria-pressed', String(!Music.muted)); }
  function toggleSound() {
    Music.setMuted(!Music.muted);
    syncSound();
    announce(Music.muted ? 'Sonido apagado' : 'Sonido encendido');
  }
  soundBtn.addEventListener('click', () => { toggleSound(); soundBtn.blur(); });
  syncSound();

  ui.jump.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
  ui.jump.addEventListener('click', (e) => { if (e.detail === 0) jump(); });
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });

  const isJumpKey = (k) => k === ' ' || k === 'Spacebar' || k === 'ArrowUp';
  addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement) return;  // escribiendo iniciales
    if (isJumpKey(e.key)) {
      e.preventDefault();
      if (state === 'running') jump();
      else if (e.repeat) return;
      else if (state === 'paused') resume();
      else if (state === 'start') start();
      else if (state === 'over' && overShown && performance.now() - overAt > 400) start();
    } else if (e.key === 'Escape') {
      pause();
    } else if ((e.key === 'm' || e.key === 'M') && !e.repeat) {
      toggleSound();
    }
  });
  addEventListener('keyup', (e) => {
    if (isJumpKey(e.key) && !(e.target instanceof HTMLInputElement)) e.preventDefault();
  });

  addEventListener('blur', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  portrait.addEventListener('change', () => { if (portrait.matches) pause(); });

  reset();
  ui.startBest.textContent = best;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
