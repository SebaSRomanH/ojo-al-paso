# Cada vez que llega código a GitHub, corre tests/validar.mjs.
# En la pestaña "Actions" del repo aparece ✅ si todo está bien o ❌ si algo falló.
name: Validar juego

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisar dibujos, saltos, textos y recursos
        run: node tests/validar.mjs
      # Abre tests/escenarios.html en Chrome sin pantalla (viene instalado en ubuntu-latest)
      # y revisa puntaje, pausa, bolsas, ranking, victoria y estadísticas.
      - name: Escenarios de juego en Chrome sin pantalla
        run: |
          python3 -m http.server 8081 > /dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=180000 \
            --dump-dom "http://localhost:8081/tests/escenarios.html" > resultado.html
          node tests/leer-escenarios.mjs resultado.html
